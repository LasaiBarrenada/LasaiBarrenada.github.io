# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Lasai Barreñada"                                # Your name
  description: "Personal page for disseminating research work"   # A brief slogan (optional)
  image: img/my_image.jpg
  
  favicon: img/logo_lb.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /img/logo_lb.png
    
    # your sub-pages
    left:
      - text: "Projects"
        href: projects/index.qmd
      - text: "Conferences"
        href: conferences/index.qmd
      - text: "CV"
        href: cv/index.qmd
      - text: "Publications"
        href: Publications/index.qmd
    # your social media handles
    right:
      - icon: bank
        href: https://www.kuleuven.be/wieiswie/en/person/00158158
      - icon: twitter
        href: https://twitter.com/BarrenadaLasai
      - icon: linkedin
        href: https://www.linkedin.com/in/lasaib/
      - icon: envelope
        aria-label: email
        href: "mailto:lasai.barrenadataleb@kuleuven.be"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: |
      <span class="faux-block">&#169; 2023 Marvin Schmitt CC BY-SA 4.0</span>
    right: |
      <span class="faux-block"><a href="https://github.com/LasaiBarrenada/LasaiBarrenada.github.io/">View source on GitHub</a></span>

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true